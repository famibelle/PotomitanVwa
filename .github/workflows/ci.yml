name: POTOMITAN Whisper CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 ffmpeg
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test imports and basic functionality
      run: |
        python -c "import torch; print('PyTorch version:', torch.__version__)"
        python -c "import transformers; print('Transformers version:', transformers.__version__)"
        python -c "import datasets; print('Datasets version:', datasets.__version__)"
        python -c "from FineTunePotomitan import *; print('FineTunePotomitan imports successful')"
    
    - name: Test configuration
      run: |
        python -c "import config; print('Configuration loaded successfully')"
    
    # Note: Actual training tests would require HuggingFace credentials and dataset access
    # These would be added in a separate workflow for authorized environments

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'
      continue-on-error: true
    
    - name: Check for secrets
      run: |
        # Basic check for common secret patterns
        if grep -r "sk-" . --exclude-dir=.git || grep -r "hf_" . --exclude-dir=.git; then
          echo "⚠️ Potential secrets found!"
          exit 1
        fi
        echo "✅ No obvious secrets detected"